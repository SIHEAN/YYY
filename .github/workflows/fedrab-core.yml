name: FedRAB core tests

on:
  push:
    branches: [fedrab-v1-delivery]
    paths:
      - 'FedRAB_v1/**'
      - '.github/workflows/fedrab-core.yml'
  pull_request:
    paths:
      - 'FedRAB_v1/**'
      - '.github/workflows/fedrab-core.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FedRAB_v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -q --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -q pytest numpy
      - name: Compile
        run: python -m compileall -q fedrab scripts tests
      - name: Run tests and save diagnostics
        id: pytest
        shell: bash
        run: |
          set +e
          pytest -vv > pytest-output.txt 2>&1
          code=$?
          cat pytest-output.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload pytest diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: fedrab-pytest-output
          path: FedRAB_v1/pytest-output.txt
      - name: Enforce pytest success
        shell: bash
        run: test "${{ steps.pytest.outputs.exit_code }}" = "0"
